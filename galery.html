<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: rgb(163, 245, 245);
}

header {
    padding: 20px;
    text-align: center;
    background: rgb(163, 245, 245);
}

nav a {
    text-decoration: none;
    margin: 0 10px;
    color: black;
    font-weight: auto;
}

nav a:hover {
    color: blue;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px;
}

.gallery figure {
    text-align: center;
    transition: 0.3s;
}

.gallery figure:hover {
    transform: translateY(-8px);
}

.gallery img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
}

        @media (max-width: 768px) {
            .hero-container {
                height: 300px;
            }
        }

        @media (max-width: 1024px) {

            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }

            header img {
                width: 250px;
            }
        }
        
        @media (max-width: 600px) {

            nav {
                flex-direction: column;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            header img {
                width: 180px;
            }

            table {
                font-size: 14px;
            }

            input, textarea {
                width: 100%;
            }

            button {
                width: 100%;
            }
        }

</style>

</head>
